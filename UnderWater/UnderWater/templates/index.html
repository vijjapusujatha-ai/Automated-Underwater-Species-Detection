<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Species Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
        }

        #videoFeed {
            width: 100%;
            height: auto;
            border-radius: 10px;
            border: 3px solid #667eea;
            background: #000;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f7fafc;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #edf2f7;
        }

        .upload-area.dragover {
            border-color: #4299e1;
            background: #bee3f8;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
            transform: translateY(-2px);
        }

        .btn.active {
            background: #2d3748;
            color: white;
        }

        .status-panel {
            background: #f7fafc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 600;
            color: #4a5568;
        }

        .status-value {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-active {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-inactive {
            background: #fed7d7;
            color: #742a2a;
        }

        .detection-results {
            background: #f7fafc;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .detection-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .detection-species {
            font-weight: 600;
            color: #2d3748;
            font-size: 1.1em;
        }

        .detection-confidence {
            color: #718096;
            font-size: 0.9em;
        }

        #resultImage {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            border: 3px solid #667eea;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .alert-info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐠 Underwater Species Detection</h1>
            <p class="subtitle">Real-time detection using YOLOv8</p>
        </header>

        <div class="main-content">
            <!-- Live Video Section -->
            <div class="card">
                <h2>📹 Live Video Detection</h2>
                
                <div class="video-container">
                    <img id="videoFeed" src="/video_feed" alt="Live video feed">
                </div>

                <div class="controls">
                    <button id="toggleDetection" class="btn btn-primary active">
                        Detection: ON
                    </button>
                    <button id="toggleAlarm" class="btn btn-secondary active">
                        Alarm: ON
                    </button>
                    <button id="testAlarm" class="btn btn-danger">
                        Test Alarm
                    </button>
                </div>

                <div class="status-panel">
                    <div class="status-item">
                        <span class="status-label">Detection Status:</span>
                        <span id="detectionStatus" class="status-value status-active">ACTIVE</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Alarm Status:</span>
                        <span id="alarmStatus" class="status-value status-active">ACTIVE</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Camera:</span>
                        <span id="cameraStatus" class="status-value status-active">CONNECTED</span>
                    </div>
                </div>
            </div>

            <!-- Image Upload Section -->
            <div class="card">
                <h2>📤 Upload Image for Detection</h2>
                
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p><strong>Click to upload or drag and drop</strong></p>
                    <p>PNG, JPG, GIF up to 50MB</p>
                    <input type="file" id="fileInput" accept="image/*">
                </div>

                <div id="uploadResults">
                    <!-- Results will be displayed here -->
                </div>
            </div>
        </div>

        <!-- Detection History -->
        <div class="card">
            <h2>🔍 Detection History</h2>
            <div id="detectionHistory" class="detection-results">
                <p style="text-align: center; color: #718096;">No detections yet...</p>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let detectionEnabled = true;
        let alarmEnabled = true;

        // DOM elements
        const videoFeed = document.getElementById('videoFeed');
        const toggleDetectionBtn = document.getElementById('toggleDetection');
        const toggleAlarmBtn = document.getElementById('toggleAlarm');
        const testAlarmBtn = document.getElementById('testAlarm');
        const detectionStatus = document.getElementById('detectionStatus');
        const alarmStatus = document.getElementById('alarmStatus');
        const cameraStatus = document.getElementById('cameraStatus');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadResults = document.getElementById('uploadResults');
        const detectionHistory = document.getElementById('detectionHistory');

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus();
            setupEventListeners();
        });

        // Setup event listeners
        function setupEventListeners() {
            // Toggle detection
            toggleDetectionBtn.addEventListener('click', toggleDetection);
            
            // Toggle alarm
            toggleAlarmBtn.addEventListener('click', toggleAlarm);
            
            // Test alarm
            testAlarmBtn.addEventListener('click', testAlarm);
            
            // File upload
            uploadArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            
            // Drag and drop
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);
            
            // Video feed error handling
            videoFeed.addEventListener('error', handleVideoError);
            videoFeed.addEventListener('load', handleVideoLoad);
        }

        // Toggle detection
        async function toggleDetection() {
            try {
                const response = await fetch('/toggle_detection', { method: 'POST' });
                const data = await response.json();
                detectionEnabled = data.detection_enabled;
                updateStatus();
            } catch (error) {
                console.error('Error toggling detection:', error);
            }
        }

        // Toggle alarm
        async function toggleAlarm() {
            try {
                const response = await fetch('/toggle_alarm', { method: 'POST' });
                const data = await response.json();
                alarmEnabled = data.alarm_enabled;
                updateStatus();
            } catch (error) {
                console.error('Error toggling alarm:', error);
            }
        }

        // Test alarm
        async function testAlarm() {
            try {
                const response = await fetch('/test_alarm');
                const data = await response.json();
                if (data.success) {
                    showAlert('Alarm test successful!', 'info');
                }
            } catch (error) {
                console.error('Error testing alarm:', error);
                showAlert('Error testing alarm', 'error');
            }
        }

        // Update status display
        async function updateStatus() {
            try {
                const response = await fetch('/get_status');
                const data = await response.json();
                
                detectionEnabled = data.detection_enabled;
                alarmEnabled = data.alarm_enabled;
                
                // Update buttons
                toggleDetectionBtn.textContent = `Detection: ${detectionEnabled ? 'ON' : 'OFF'}`;
                toggleDetectionBtn.className = detectionEnabled ? 'btn btn-primary active' : 'btn btn-primary';
                
                toggleAlarmBtn.textContent = `Alarm: ${alarmEnabled ? 'ON' : 'OFF'}`;
                toggleAlarmBtn.className = alarmEnabled ? 'btn btn-secondary active' : 'btn btn-secondary';
                
                // Update status indicators
                detectionStatus.textContent = detectionEnabled ? 'ACTIVE' : 'INACTIVE';
                detectionStatus.className = detectionEnabled ? 'status-value status-active' : 'status-value status-inactive';
                
                alarmStatus.textContent = alarmEnabled ? 'ACTIVE' : 'INACTIVE';
                alarmStatus.className = alarmEnabled ? 'status-value status-active' : 'status-value status-inactive';
                
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        // File handling
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadFile(file);
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            uploadArea.classList.add('dragover');
        }

        function handleDragLeave(event) {
            event.preventDefault();
            uploadArea.classList.remove('dragover');
        }

        function handleDrop(event) {
            event.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        }

        async function uploadFile(file) {
            console.log('Starting file upload:', file.name, file.type, file.size);
            
            if (!file.type.startsWith('image/')) {
                showAlert('Please upload an image file', 'error');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showAlert('File size must be less than 50MB', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            uploadResults.innerHTML = '<div class="loading"><div class="spinner"></div>Processing...</div>';

            try {
                console.log('Sending request to server...');
                const response = await fetch('/upload_image', {
                    method: 'POST',
                    body: formData
                });

                console.log('Response received:', response.status, response.statusText);

                const data = await response.json();
                console.log('Response data:', data);

                if (data.success) {
                    displayUploadResults(data);
                    addToDetectionHistory(data.detections);
                } else {
                    showAlert(data.error || 'Error processing image', 'error');
                    uploadResults.innerHTML = '';
                }
            } catch (error) {
                console.error('Error uploading file:', error);
                showAlert('Error uploading file: ' + error.message, 'error');
                uploadResults.innerHTML = '';
            }
        }

        function displayUploadResults(data) {
            let html = '';

            if (data.detections.length > 0) {
                html += '<div class="alert alert-success">';
                html += `✅ Detected ${data.detections.length} species(s)`;
                html += '</div>';

                data.detections.forEach(detection => {
                    html += `
                        <div class="detection-item">
                            <div class="detection-species">${detection.class}</div>
                            <div class="detection-confidence">Confidence: ${(detection.confidence * 100).toFixed(1)}%</div>
                        </div>
                    `;
                });

                html += `<img id="resultImage" src="${data.image}" alt="Detection result">`;
            } else {
                html = '<div class="alert alert-info">ℹ️ No species detected in this image</div>';
                html += `<img id="resultImage" src="${data.image}" alt="Uploaded image">`;
            }

            uploadResults.innerHTML = html;
        }

        function addToDetectionHistory(detections) {
            if (detections.length === 0) return;

            const timestamp = new Date().toLocaleTimeString();
            let historyHtml = '';

            detections.forEach(detection => {
                historyHtml += `
                    <div class="detection-item">
                        <div class="detection-species">${detection.class}</div>
                        <div class="detection-confidence">Confidence: ${(detection.confidence * 100).toFixed(1)}% - ${timestamp}</div>
                    </div>
                `;
            });

            // Add to beginning of history
            detectionHistory.innerHTML = historyHtml + detectionHistory.innerHTML;

            // Limit history to 20 items
            const items = detectionHistory.querySelectorAll('.detection-item');
            if (items.length > 20) {
                items[items.length - 1].remove();
            }
        }

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            document.body.insertBefore(alert, document.body.firstChild);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        function handleVideoError() {
            cameraStatus.textContent = 'DISCONNECTED';
            cameraStatus.className = 'status-value status-inactive';
        }

        function handleVideoLoad() {
            cameraStatus.textContent = 'CONNECTED';
            cameraStatus.className = 'status-value status-active';
        }

        // Update status every 5 seconds
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
